<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#58141b">
  <title>Order Administration | Nivan Crackers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="admin-header">
    <div class="container admin-container d-flex align-items-center justify-content-between gap-3">
      <a class="admin-brand" href="/admin"><span class="admin-brand-mark">N</span><span><strong>NIVAN CRACKERS</strong><small>ORDER ADMINISTRATION</small></span></a>
      <a class="store-link" href="/">Customer order page <span aria-hidden="true">↗</span></a>
    </div>
  </header>

  <main class="container admin-container py-4 py-lg-5">
    <div class="admin-title-row">
      <div><p class="admin-eyebrow">OPERATIONS / ORDERS</p><h1>Order management</h1><p class="admin-subtitle">Review incoming orders and update fulfillment status.</p></div>
      <button id="refresh-orders" class="btn refresh-button" type="button" title="Refresh orders">Refresh</button>
    </div>

    <div id="admin-alert" class="alert d-none" role="status" aria-live="polite"></div>

    <section class="orders-panel" aria-labelledby="orders-heading">
      <div class="orders-panel-heading"><div><h2 id="orders-heading">Orders</h2><span id="orders-count" class="orders-count">Loading…</span></div><label class="visually-hidden" for="orders-search">Search orders</label><input id="orders-search" class="form-control orders-search" type="search" placeholder="Search ID, name, or mobile"></div>
      <div class="table-responsive">
        <table class="table orders-table align-middle mb-0">
          <thead><tr><th scope="col">Order ID</th><th scope="col">Customer</th><th scope="col">Mobile</th><th scope="col">Status</th></tr></thead>
          <tbody id="orders-list"><tr><td class="table-message" colspan="4">Loading orders…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal fade" id="order-modal" tabindex="-1" aria-labelledby="order-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable"><div class="modal-content">
      <div class="modal-header"><div><p class="admin-eyebrow mb-1">ORDER DETAILS</p><h2 class="modal-title" id="order-modal-title">Invoice</h2></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body"><div id="order-invoice" class="order-invoice"></div></div>
      <div class="modal-footer"><button id="print-order" class="btn print-order-button" type="button">Print invoice</button><button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Close</button></div>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="admin.js" defer></script>
</body>
</html>
